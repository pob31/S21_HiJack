[package]
name = "s21_hijack"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "DiGiCo S21/S31 snapshot manager daemon"
license = "MIT OR Apache-2.0"

[lints.clippy]
# The daemon's wiring naturally takes 8–13 Arc<RwLock<…>> arguments through
# the engine constructors. Refactoring into struct-of-handles is tracked as
# audit M10 and is a separate cleanup pass.
too_many_arguments = "allow"
# A handful of typed enums (BankData, MacroStep, etc.) carry tuple data that
# clippy thinks is "too complex". Type aliases would help but aren't urgent.
type_complexity = "allow"
# `field_reassign_with_default` flags clear, deliberate per-test config builds
# where the struct-init form would obscure which field the test cares about.
field_reassign_with_default = "allow"
# `collapsible_if` (as of clippy 1.95) rewrites nested `if { if let … }` into
# `let`-chains. The daemon deliberately keeps the guard and the `if let` on
# separate lines for readability across ~70 connection/UI sites; collapsing
# them buys nothing and churns unrelated code. Kept as a style choice.
collapsible_if = "allow"

[lints.rust]
# `float-literal-f32-fallback` (rustc 1.97, rust-lang/rust#154024): an untyped
# float literal passed to egui's `Stroke::new(impl Into<f32>, …)` (and kin)
# falls back to f32 because f64 doesn't satisfy the `Into<f32>` bound. Benign —
# the literals ARE f32 — but it fires ~55× across the egui UI code and is
# `-D warnings`-fatal on 1.97. Allow until the egui 0.35 upgrade reworks these
# call sites (the same upgrade tracked for the quick-xml advisories in
# release.yml); suffixing every literal with `_f32` is the alternative.
float_literal_f32_fallback = "allow"

[dependencies]
tokio = { version = "1", features = ["full"] }
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
eframe = "0.33"
egui_extras = "0.33"
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
dirs = "5"
# Stream Deck integration (Macros tab): cross-platform driver via hidapi.
# `elgato-streamdeck` covers Original / Mini / XL / MK.2 / Plus / Pedal on
# Linux / macOS / Windows. `imageproc` + `ab_glyph` render the per-button
# LCD label (next-to-fire macro name) on a JPEG buffer pushed to the device.
elgato-streamdeck = "0.9"
imageproc = "0.25"
ab_glyph = "0.2"
hidapi = "2"

# MIDI output for external cue triggers (Ableton scenes etc.). Cross-platform
# via CoreMIDI (macOS), ALSA seq (Linux/Raspberry Pi), WinMM (Windows). The
# API is blocking and not Send, so the engine isolates it on its own OS thread
# (see `console::midi_engine`), mirroring the Stream Deck device thread.
midir = "0.10"

# Web monitor surface: axum HTTP + WebSocket server. `ws` adds the WebSocket
# extractor for the browser monitor protocol; default features give
# axum::serve, ConnectInfo<SocketAddr>, graceful shutdown, and middleware::from_fn.
axum = { version = "0.8", features = ["ws"] }
# Split the axum WebSocket into independent read/write halves (StreamExt/SinkExt).
futures-util = "0.3"
# Embed the browser monitor UI (web/dist) into the binary so the Pi/single-binary
# build needs no Node — web/dist is committed and rebuilt only when the UI changes.
rust-embed = "8"
mime_guess = "2"
# Per-profile QR codes in the Monitor tab (deep-link a musician's browser to
# their mix). Core only — we rasterize the modules to an egui texture ourselves.
qrcode = { version = "0.14", default-features = false }
ureq = "3.3.0"

# ── Physical display metrics (real PPI) for DPI-aware UI scaling ──
# Per-platform: macOS via Core Graphics, Windows via the raw-DPI monitor API,
# Linux via DRM sysfs EDID (no extra dep). Each backend degrades to "unknown"
# (→ respect the OS scale factor) on any failure, so a missing/odd display
# never breaks the UI.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

# Embed the app icon + version-info resource into s21_hijack.exe (see build.rs).
# Host-gated to Windows so non-Windows builds neither pull nor compile it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Property-based / random-input testing for the network-boundary OSC parsers
# (audit M6). Stable Rust; runs as part of `cargo test`. For deeper
# coverage-guided fuzzing, `cargo install cargo-fuzz` separately + nightly
# toolchain — proptest is the always-on safety net.
proptest = "1"
# WebSocket client for the web-monitor integration test (same version axum
# pulls in transitively, so no extra download). Drives a real /ws connection.
tokio-tungstenite = "0.29"
