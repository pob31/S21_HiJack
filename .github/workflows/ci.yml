name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build deps (libudev for hidapi-rs, libasound2 for midir)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build deps (libudev for hidapi-rs, libasound2 for midir)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # NOTE: pinned at v2 (Node 20) deliberately — rustsec/audit-check has no
      # Node 24 release yet (latest is v2.0.0). This emits the GitHub Actions
      # "Node.js 20 is deprecated" WARNING (not an error); the runner forces it
      # onto Node 24 from 2026-06-16 and removes Node 20 on 2026-09-16. Bump to
      # a Node 24 release when one ships.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0194 / -0195: quick-xml DoS advisories (need >=0.41.0).
          # Reached ONLY as a build-time, Linux-only transitive of
          # `wayland-scanner` (locked to quick-xml ^0.39 via winit 0.30 / eframe
          # 0.33), whose proc-macro parses the trusted, bundled Wayland protocol
          # XML at compile time — never attacker-controlled input, so the DoS is
          # unreachable here. The real fix is the winit/eframe 0.35 upgrade
          # (a separate breaking change); drop these ignores once that lands.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
